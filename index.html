<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Re Piola Games</title>

    <!-- Iconos de Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Estilos generales y compartidos -->
    <link rel="stylesheet" href="./css/base.css">
    <link rel="stylesheet" href="./css/header.css">
    <link rel="stylesheet" href="./css/componentes.css">

    <!-- Estilos del inicio y pie de página -->
    <link rel="stylesheet" href="./css/inicio.css">
    <link rel="stylesheet" href="./css/footer.css">
</head>

<body>

    <!-- ===== 1. CABECERA ===== -->

    <div id="cabecera-sitio"></div>

    <!-- ===== 2. CONTENIDO PRINCIPAL ===== -->

    <main class="inicio">

        <!-- ===== 2.1. PORTADA Y CARRUSEL ===== -->

        <section id="hero">

            <!-- Imagen que actualiza carrusel.js -->
            <img src="./img/01.png" alt="Habitación gamer con computadora y luces violetas", id="img-carrusel" class="carrusel-fondo">

            <!-- Presentación y enlaces -->
            <div class="hero-texto">
                <h1>
                    Tu mundo gamer
                    <span>en un solo lugar</span>
                </h1>

                <p>
                    Descubrí nuevos juegos, compartí tu pasión y viví
                    la experiencia gamer en un solo lugar.
                </p>

                <div class="hero-botones">
                    <a href="./contacto.html" class="btn">Unirme ahora</a>
                    <a href="./juegos.html" class="btn-secundario">
                        Explorar Juegos
                    </a>
                </div>
            </div>

            <!-- Controles del carrusel -->
            <button id="btn-ant" class="carrusel-btn" aria-label="anterior">
                <i class="fa-solid fa-chevron-left"></i>
            </button>

            <button id="btn-sig" class="carrusel-btn" aria-label="siguiente">
                <i class="fa-solid fa-chevron-right"></i>
            </button>

        </section>

        <!-- ===== 2.2. JUEGOS POPULARES ===== -->

        <section id="juegos-populares">

            <!-- Título y enlace al catálogo -->
            <header>
                <h2>Lo más popular</h2>
                <a href="./juegos.html">
                    Ver todos
                    <i class="fa-solid fa-arrow-right"></i>
                </a>
            </header>

            <!-- Tarjetas organizadas con Flexbox -->
            <div class="grid-juegos">

                <article class="card-juego">
                    <img src="./img/FC-27.avif" alt="FC-27">
                    <h3>FC 27</h3>
                </article>

                <article class="card-juego">
                    <img src="./img/CallOfDuty.webp" alt="Call of Duty">
                    <h3>Call of Duty</h3>
                </article>

                <article class="card-juego">
                    <img src="./img/Fornite.webp" alt="Fortnite">
                    <h3>Fortnite</h3>
                </article>

                <article class="card-juego">
                    <img src="./img/ForzaHorizon.webp" alt="Forza Horizon">
                    <h3>Forza Horizon</h3>
                </article>

                <article class="card-juego">
                    <img src="./img/GtaV.webp" alt="GTA V">
                    <h3>GTA V</h3>
                </article>

            </div>

        </section>

    </main>

    <!-- ===== 3. PIE DE PÁGINA ===== -->

    <div id="pie-sitio"></div>

    <!-- ===== 4. JAVASCRIPT ===== -->

    <script src="./js/carrusel.js"></script>
    <script src="./js/componentes.js"></script>
</body>

</html>
