<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto</title>
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <header>
        <!-- LOGO -->
        <div class="logo">
            <a href="./index.html">
                <span>🎮</span>
                <span>Re Piola Games</span>
                <span>🎮</span>
            </a>
        </div>

        <!--  NAVEGACIÓN PRINCIPAL   -->
        <nav>
            <ul>
                <li> <a href="./index.html">Inicio</a></li>
                <li> <a href="./contacto.html" class="activo">Contacto</a></li>
                <li> <a href="./juegos.html">Juegos</a></li>
                <li> <a href="./perfil.html">Perfil</a></li>
                <li> <a href="./login.html">Login</a></li>
                <li> <a href="./noticias.html">Noticias</a></li>
            </ul>
        </nav>

        <!--  BUSCADOR   -->
        <form class="buscador">
            <input type="text" id="buscar" name="buscar" placeholder="Buscar juegos...">
            <button type="submit">🔍</button>
        </form>

        <!--  NOTIFICACIONES   -->
        <div class="usuario-panel">
            <button type="button">🔔</button>
            <a href="./login.html">
                <img src="img/usuario.jpg" alt="Perfil de Usuario">
            </a>
        </div>
    </header>

    <section id="contacto">
        <H1>CONTACTATE CON NOSOTROS</H1>
        <H2>¿Tienes consultas? Escribinos</H2>
        <form action="GET">
            <div>
                <label for="name">Nombre completo</label>
                <input type="text" id="name" name="nombre" placeholder="Ej. Franco Orozco">
            </div>

            <div>
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" name="email" placeholder="ejemplo@gmail.com" required>
            </div>

            <div>
                <label for="numero">Teléfono</label>
                <input type="number" id="numero" name="numero" placeholder="2664840848" required>
            </div>

            <div>
                <label for="asunto">Asunto</label>
                <input type="text" id="asunto" name="asunto" placeholder="Consulta">
            </div>

            <div>
                <label for="mensaje">Mensaje</label>
                <textarea name="mensaje" id="mensaje" placeholder="Ingrese su mensaje..." rows="6" required>
            </textarea>
            </div>

            <button type="submit">Enviar</button>
        </form>
    </section>
</body>

</html>
