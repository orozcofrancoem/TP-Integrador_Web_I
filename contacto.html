<section id="contacto">
    <header>
        <H2>CONTÁCTANOS</H2>
        <p>Ponte en contacto con nosotros</p>
    </header>

    <form action="GET">
        <div>
            <label for="name">Nombre completo</label>
            <input type="text" id="name" name="nombre" placeholder="Ej. Franco Orozco">
        </div>

        <div>
            <label for="email">Correo Electrónico</label>
            <input type="email" id="email" name="email" placeholder="ejemplo@gmail.com" required>
        </div>

        <div>
            <label for="numero">Teléfono</label>
            <input type="number" id="numero" name="numero" placeholder="2664840848" required>
        </div>

        <div>
            <label for="asunto">Asunto</label>
            <input type="text" id="asunto" name="asunto" placeholder="Consulta">
        </div>

        <div>
            <label for="mensaje">Mensaje</label>
            <textarea name="mensaje" id="mensaje" placeholder="Ingrese su mensaje..." rows="6" required>
            </textarea>
        </div>

        <button type="submit">Enviar</button>
    </form>
</section>
