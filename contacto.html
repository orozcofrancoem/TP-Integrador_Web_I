<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | Re Piola Games</title>

    <!-- Iconos de Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Estilos generales y compartidos -->
    <link rel="stylesheet" href="./css/base.css">
    <link rel="stylesheet" href="./css/header.css">
    <link rel="stylesheet" href="./css/componentes.css">
    <link rel="stylesheet" href="./css/footer.css">
    <link rel="stylesheet" href="./css/contacto.css">
</head>

<body>

    <!-- ===== 1. CABECERA ===== -->

    <div id="cabecera-sitio"></div>

    <!-- ===== 2. CONTENIDO PRINCIPAL ===== -->

    <main>

        <section id="contacto">

            <!-- ===== 2.1. PRESENTACIÓN ===== -->

            <div class="contacto-header">
                <h1>CONTACTATE CON NOSOTROS</h1>
                <p>
                    ¿Tienes consultas o sugerencias?
                    Escribinos y te responderemos a la brevedad
                </p>
            </div>

            <!-- ===== 2.2. FORMULARIO DE CONTACTO ===== -->

            <div class="contenedor-formulario">

                <form id="form-contacto" novalidate>

                    <!-- Nombre completo -->
                    <div class="campo-grupo">
                        <label for="nombre">Nombre completo *</label>
                        <input
                            type="text"
                            id="nombre"
                            name="nombre"
                            placeholder="Ej. Franco Orozco"
                        >
                        <span class="error-msg" id="error-nombre"></span>
                    </div>

                    <!-- Correo electrónico -->
                    <div class="campo-grupo">
                        <label for="email">Correo Electrónico *</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="ejemplo@gmail.com"
                        >
                        <span class="error-msg" id="error-email"></span>
                    </div>

                    <!-- Teléfono -->
                    <div class="campo-grupo">
                        <label for="telefono">Teléfono *</label>
                        <input
                            type="tel"
                            id="telefono"
                            name="telefono"
                            placeholder="ej. 2664840848"
                        >
                        <span class="error-msg" id="error-telefono"></span>
                    </div>

                    <!-- Asunto -->
                    <div class="campo-grupo">
                        <label for="asunto">Asunto *</label>
                        <input
                            type="text"
                            id="asunto"
                            name="asunto"
                            placeholder="Ej. Consulta sobre juegos"
                        >
                        <span class="error-msg" id="error-asunto"></span>
                    </div>

                    <!-- Mensaje -->
                    <div class="campo-grupo">
                        <label for="mensaje">Mensaje *</label>
                        <textarea
                            id="mensaje"
                            name="mensaje"
                            placeholder="Ingrese su mensaje aquí..."
                            rows="5"
                        ></textarea>
                        <span class="error-msg" id="error-mensaje"></span>
                    </div>

                    <!-- Envío del formulario -->
                    <button type="submit" class="btn">Enviar</button>

                </form>

                <!-- ===== 2.3. RESUMEN DEL FORMULARIO ===== -->

                <div id="resumen-envio"></div>

            </div>

        </section>

    </main>

    <!-- ===== 3. PIE DE PÁGINA ===== -->

    <div id="pie-sitio"></div>

    <!-- ===== 4. JAVASCRIPT ===== -->

    <script src="./js/contacto.js"></script>
    <script src="./js/componentes.js"></script>
</body>

</html>
